<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Vishu Paradise — Digital Growth Studio</title>
<desc id="desc">Contemporary VP monogram with a rising signal and clean wordmark.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#36D6C3"/><stop offset="1" stop-color="#76F0A8"/></linearGradient>
  <linearGradient id="a" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#FA8C63"/><stop offset="1" stop-color="#FFC16F"/></linearGradient>
</defs>
<!-- distinctive rounded monogram tile -->
<rect x="52" y="46" width="268" height="268" rx="72" fill="#10233B"/>
<!-- V formed as a rising path -->
<path d="M100 112 164 244 230 112" fill="none" stroke="url(#g)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
<!-- P stem and bowl -->
<path d="M197 246V130c0-13 10-23 23-23h27c35 0 56 20 56 49s-21 49-56 49h-43" fill="none" stroke="#F7FAFC" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
<!-- upward signal spark -->
<path d="m247 88 15-20 15 20" fill="none" stroke="url(#a)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="262" cy="62" r="5" fill="#FFC16F"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="376" y="172" fill="#10233B" font-size="82" font-weight="700" letter-spacing="-3">Vishu</text>
  <text x="382" y="233" fill="#50657A" font-size="43" font-weight="500" letter-spacing="10">PARADISE</text>
  <rect x="384" y="265" width="36" height="5" rx="2.5" fill="url(#g)"/>
  <text x="436" y="274" fill="#718296" font-size="18" font-weight="700" letter-spacing="4.2">DIGITAL GROWTH STUDIO</text>
</g>
</svg>
